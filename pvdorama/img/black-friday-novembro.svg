  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="230" cy="65" r="260" fill="url(#glow)"/><circle cx="1040" cy="310" r="280" fill="url(#glow)"/>
  <path d="M0 305 300 0h85L60 420H0zm930 115L1200 125v85l-190 210z" fill="#ff4391" opacity=".07"/>
  <rect x="18" y="18" width="1164" height="324" rx="24" fill="none" stroke="#ff93bd" stroke-opacity=".55" stroke-width="2"/>
  <path d="M75 67h217M908 67h218" stroke="url(#gold)" stroke-width="2" opacity=".7"/>
  <text x="600" y="71" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" letter-spacing="5">OFERTA ESPECIAL DE NOVEMBRO · DORAMAPLAY</text>
  <text x="600" y="167" text-anchor="middle" fill="#fff9fc" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="900" letter-spacing="-4" filter="url(#shadow)">BLACK</text>
