<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title description">
  <title id="title">Black Friday de novembro DoramaPlay</title>
  <desc id="description">Oferta especial de novembro com mais de 75% de desconto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160719"/><stop offset=".6" stop-color="#2c0b26"/><stop offset="1" stop-color="#09080e"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9ad0"/><stop offset=".5" stop-color="#ff3b93"/><stop offset="1" stop-color="#e32378"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff2b8"/><stop offset=".55" stop-color="#ffd476"/><stop offset="1" stop-color="#ffaf60"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f72c88" stop-opacity=".38"/><stop offset="1" stop-color="#f72c88" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#eb1f77" flood-opacity=".5"/></filter>
  </defs>
  <rect width="640" height="540" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="120" r="230" fill="url(#glow)"/><circle cx="540" cy="500" r="260" fill="url(#glow)"/>
  <path d="M0 450 400 0h90L0 540zm420 250 220-260v100L530 700z" fill="#ff4897" opacity=".09"/>
  <rect x="16" y="16" width="608" height="508" rx="22" fill="none" stroke="#ff9ac5" stroke-opacity=".58" stroke-width="2"/>
  <text x="320" y="78" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" letter-spacing="4">OFERTA ESPECIAL</text>
  <text x="320" y="109" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="5">DE NOVEMBRO</text>
  <text x="320" y="242" text-anchor="middle" fill="#fff9fc" font-family="Arial,Helvetica,sans-serif" font-size="110" font-weight="900" letter-spacing="-5" filter="url(#shadow)">BLACK</text>
  <text x="320" y="342" text-anchor="middle" fill="url(#pink)" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900" letter-spacing="-6" filter="url(#shadow)">FRIDAY</text>
  <text x="320" y="390" text-anchor="middle" fill="#ffe5f0" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" letter-spacing="3">DORAMAPLAY</text>
  <rect x="71" y="420" width="498" height="76" rx="38" fill="url(#gold)"/>
  <text x="320" y="470" text-anchor="middle" fill="#2a1121" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">MAIS DE 75% OFF</text>
