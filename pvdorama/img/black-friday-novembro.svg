<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Black Friday de novembro DoramaPlay</title>
  <desc id="description">Oferta especial de novembro com mais de 75% de desconto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120716"/><stop offset=".52" stop-color="#210a1d"/><stop offset="1" stop-color="#08070e"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff98ce"/><stop offset=".46" stop-color="#ff378d"/><stop offset="1" stop-color="#e72077"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff1b2"/><stop offset=".5" stop-color="#ffd978"/><stop offset="1" stop-color="#ffad59"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f72c88" stop-opacity=".42"/><stop offset="1" stop-color="#f72c88" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ec1f78" flood-opacity=".55"/></filter>
